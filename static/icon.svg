<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#09B1BA"/>
  <!-- Camera body -->
  <rect x="80" y="168" width="352" height="240" rx="40" fill="white" opacity="0.95"/>
  <!-- Viewfinder bump -->
  <rect x="196" y="128" width="120" height="56" rx="18" fill="white" opacity="0.95"/>
  <!-- Lens outer -->
  <circle cx="256" cy="292" r="82" fill="#09B1BA"/>
  <!-- Lens middle -->
  <circle cx="256" cy="292" r="60" fill="white" opacity="0.25"/>
  <!-- Lens inner -->
  <circle cx="256" cy="292" r="40" fill="white"/>
  <!-- Flash -->
  <rect x="340" y="196" width="52" height="32" rx="10" fill="#09B1BA"/>
  <!-- Euro sign in lens -->
  <text x="256" y="308" font-family="-apple-system,sans-serif" font-size="42" font-weight="800" text-anchor="middle" fill="#09B1BA">€</text>
</svg>
