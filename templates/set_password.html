<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer votre mot de passe — Prizzy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
    .logo span { color: #a855f7; }
    h1 { font-size: 1.2rem; font-weight: 600; margin-bottom: 0.5rem; }
    p.sub { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 0.75rem;
      outline: none;
    }
    input:focus { border-color: #a855f7; }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #a855f7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.25rem;
    }
    button:hover { background: #9333ea; }
    .error {
      background: #3b0a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    .email-badge {
      display: inline-block;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0.25rem 0.75rem;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Prizz<span>y</span></div>
    <h1>Créez votre mot de passe</h1>
    <p class="sub">Première connexion — choisissez un mot de passe pour votre compte.</p>
    <div class="email-badge">{{ email }}</div>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/set-password">
      <input type="hidden" name="email" value="{{ email }}">
      <input type="password" name="password" placeholder="Nouveau mot de passe (8 caractères min.)"
             required minlength="8" autocomplete="new-password">
      <input type="password" name="confirm" placeholder="Confirmer le mot de passe"
             required autocomplete="new-password">
      <button type="submit">Créer mon mot de passe →</button>
    </form>
  </div>
</body>
</html>
