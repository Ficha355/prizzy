<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09B1BA">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Créer votre mot de passe — Prizzy</title>
  <style>
    :root {
      --teal:       #09B1BA;
      --teal-hover: #0a9ea6;
      --teal-dim:   rgba(9,177,186,.14);
      --teal-faint: #f0fbfc;
      --bg:         #F7F8F9;
      --surface:    #ffffff;
      --border:     #E5E7EB;
      --text:       #111827;
      --text-2:     #6B7280;
      --text-3:     #9CA3AF;
      --shadow:     0 0 0 1px rgba(0,0,0,.06), 0 4px 24px rgba(0,0,0,.08);
      --radius:     12px;
      --radius-lg:  16px;
      --transition: 150ms cubic-bezier(.4,0,.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 960px; margin: 0 auto;
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--text); }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 7px;
      background: var(--teal);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-mark svg { width: 15px; height: 15px; }
    .logo-name { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }

    /* ── Main ── */
    .page-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: calc(100vh - 57px);
      padding: 40px 24px;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 40px 36px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }

    .card-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: var(--teal-faint);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; margin: 0 auto 20px;
    }
    .card-title {
      font-size: 20px; font-weight: 800; letter-spacing: -.4px;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 14px; color: var(--text-2); line-height: 1.6;
      margin-bottom: 24px;
    }

    .email-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--teal-faint);
      border: 1px solid var(--teal-dim);
      color: var(--teal-hover);
      font-size: 13px; font-weight: 600;
      padding: 5px 12px; border-radius: 100px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex; flex-direction: column; gap: 10px;
      margin-bottom: 16px;
    }
    .form-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      font-family: inherit; font-size: 14px; color: var(--text);
      background: var(--bg); outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
      text-align: left;
    }
    .form-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-dim); }
    .form-input::placeholder { color: var(--text-3); }

    .btn-submit {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 13px 20px;
      background: var(--teal); color: white;
      font-family: inherit; font-size: 15px; font-weight: 700;
      border: none; border-radius: var(--radius);
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(9,177,186,.25);
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-submit:hover { background: var(--teal-hover); transform: translateY(-1px); box-shadow: 0 6px 28px rgba(9,177,186,.3); }

    .error-msg {
      margin-bottom: 16px; font-size: 13px;
      color: #B91C1C; background: #FEE2E2;
      padding: 8px 12px; border-radius: 8px;
      text-align: left;
    }

    .back-link {
      display: inline-block; margin-top: 20px;
      font-size: 13px; color: var(--text-3);
      text-decoration: none;
    }
    .back-link:hover { color: var(--text-2); }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="/">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
      </div>
      <span class="logo-name">Prizzy</span>
    </a>
  </div>
</nav>

<div class="page-wrap">
  <div class="card">
    <div class="card-icon">🔑</div>
    <p class="card-title">Créez votre mot de passe</p>
    <p class="card-sub">Première connexion — choisissez un mot de passe pour sécuriser votre compte.</p>
    <div class="email-badge">{{ email }}</div>

    {% if error %}
    <p class="error-msg">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/set-password">
      <input type="hidden" name="email" value="{{ email }}">
      <div class="form-group">
        <input class="form-input" type="password" name="password"
               placeholder="Nouveau mot de passe (8 caractères min.)"
               required minlength="8" autocomplete="new-password">
        <input class="form-input" type="password" name="confirm"
               placeholder="Confirmer le mot de passe"
               required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-submit">Créer mon mot de passe →</button>
    </form>

    <a class="back-link" href="/">← Retour à l'accueil</a>
  </div>
</div>

</body>
</html>
