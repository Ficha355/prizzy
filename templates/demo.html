<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09B1BA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Prizzy — Démo Photo IA</title>
  <style>
    :root {
      --teal:       #09B1BA;
      --teal-hover: #0a9ea6;
      --teal-dim:   rgba(9,177,186,.14);
      --teal-faint: #f0fbfc;
      --bg:         #F7F8F9;
      --surface:    #ffffff;
      --border:     #E5E7EB;
      --text:       #111827;
      --text-2:     #6B7280;
      --shadow:     0 0 0 1px rgba(0,0,0,.06), 0 4px 24px rgba(0,0,0,.08);
      --shadow-lg:  0 0 0 1px rgba(0,0,0,.06), 0 16px 64px rgba(0,0,0,.12);
      --radius:     12px;
      --radius-lg:  16px;
      --transition: 150ms cubic-bezier(.4,0,.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 960px; margin: 0 auto;
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--text); }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 7px;
      background: var(--teal);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-mark svg { width: 15px; height: 15px; }
    .logo-name { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
    .btn-nav {
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 8px 16px; border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface); color: var(--text-2);
      cursor: pointer; text-decoration: none;
      transition: all var(--transition);
    }
    .btn-nav:hover { background: var(--bg); color: var(--text); }

    .container { max-width: 960px; margin: 0 auto; padding: 0 24px; }

    .hero {
      padding: 72px 0 48px;
      text-align: center;
    }
    .hero-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--teal-faint); border: 1px solid var(--teal-dim);
      color: var(--teal-hover);
      font-size: 12px; font-weight: 600; letter-spacing: .3px;
      padding: 5px 12px; border-radius: 100px;
      margin-bottom: 24px;
    }
    .hero h1 {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 800; letter-spacing: -1.2px; line-height: 1.1;
      margin-bottom: 16px;
    }
    .hero h1 em { font-style: normal; color: var(--teal); }
    .hero p {
      font-size: 17px; color: var(--text-2); line-height: 1.65;
      max-width: 480px; margin: 0 auto;
    }

    .demo-section {
      padding: 56px 0 80px;
    }

    .compare-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0;
      align-items: start;
    }

    .compare-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: box-shadow var(--transition);
    }
    .compare-card:hover { box-shadow: var(--shadow-lg); }

    .card-label {
      display: flex; align-items: center; gap: 8px;
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border);
    }
    .label-badge {
      font-size: 11px; font-weight: 700; letter-spacing: .5px;
      text-transform: uppercase;
      padding: 4px 10px; border-radius: 100px;
    }
    .badge-before {
      background: #F3F4F6; color: var(--text-2);
    }
    .badge-after {
      background: var(--teal-dim); color: var(--teal-hover);
    }
    .card-label span {
      font-size: 13px; font-weight: 500; color: var(--text-2);
    }

    .card-img {
      width: 100%; display: block;
      object-fit: cover; max-height: 480px;
    }

    .arrow-divider {
      display: flex; align-items: center; justify-content: center;
      padding: 0 20px;
      margin-top: 180px;
    }
    .arrow-circle {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--teal);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(9,177,186,.35);
      flex-shrink: 0;
    }
    .arrow-circle svg { width: 20px; height: 20px; color: #fff; }

    .ai-badge {
      display: flex; align-items: center; gap: 6px;
      margin-top: 12px; justify-content: center;
    }
    .ai-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--teal);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(.75); }
    }
    .ai-text {
      font-size: 12px; font-weight: 600; color: var(--teal-hover); letter-spacing: .2px;
    }

    .cta-block {
      margin-top: 56px; text-align: center;
    }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: inherit; font-size: 15px; font-weight: 700;
      padding: 14px 28px; border-radius: 10px;
      background: var(--teal); color: #fff; border: none;
      text-decoration: none; cursor: pointer;
      box-shadow: 0 4px 16px rgba(9,177,186,.35);
      transition: all var(--transition);
    }
    .btn-primary:hover { background: var(--teal-hover); transform: translateY(-1px); box-shadow: 0 6px 24px rgba(9,177,186,.4); }
    .cta-sub { margin-top: 12px; font-size: 13px; color: var(--text-2); }

    @media (max-width: 640px) {
      .compare-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .arrow-divider {
        margin-top: 0; padding: 20px 0;
        transform: rotate(90deg);
      }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 3"/>
        </svg>
      </div>
      <span class="logo-name">Prizzy</span>
    </a>
    <a href="/" class="btn-nav">Retour à l'accueil</a>
  </div>
</nav>

<main>
  <div class="container">
    <section class="hero">
      <div class="hero-pill">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Démo
      </div>
      <h1>Photo IA — <em>avant / après</em></h1>
      <p>Envoyez une simple photo de votre vêtement, notre IA génère une image pro prête à publier sur Vinted.</p>
    </section>

    <section class="demo-section">
      <div class="compare-grid">

        <div class="compare-card">
          <div class="card-label">
            <span class="label-badge badge-before">Avant</span>
            <span>Votre photo brute</span>
          </div>
          <img class="card-img" src="/static/avant_photo.jpg" alt="Photo avant traitement IA">
        </div>

        <div class="arrow-divider">
          <div class="arrow-circle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </div>
        </div>

        <div class="compare-card">
          <div class="card-label">
            <span class="label-badge badge-after">Après</span>
            <span>Rendu IA Prizzy</span>
          </div>
          <img class="card-img" src="/static/apres_photo.png" alt="Photo après traitement IA">
          <div class="ai-badge" style="padding-bottom:16px;">
            <span class="ai-dot"></span>
            <span class="ai-text">Généré par IA</span>
          </div>
        </div>

      </div>

      <div class="cta-block">
        <a href="/" class="btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          Essayer gratuitement
        </a>
        <p class="cta-sub">7 jours d'essai gratuit · Sans engagement</p>
      </div>
    </section>
  </div>
</main>

</body>
</html>
