<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0070B8">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Connexion — Prizzy</title>
  <style>
    :root {
      --teal:       #0070B8;
      --teal-hover: #005A96;
      --teal-dim:   rgba(0,112,184,.14);
      --teal-faint: #EFF8FF;
      --bg:         #ffffff;
      --surface:    #ffffff;
      --border:     #E5E7EB;
      --text:       #111827;
      --text-2:     #6B7280;
      --text-3:     #9CA3AF;
      --shadow:     0 0 0 1px rgba(0,0,0,.06), 0 4px 24px rgba(0,0,0,.08);
      --radius:     12px;
      --radius-lg:  16px;
      --transition: 150ms cubic-bezier(.4,0,.2,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ── Nav ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 960px; margin: 0 auto;
      padding: 14px 24px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--text); }
    .logo-mark {
      width: 28px; height: 28px; border-radius: 7px;
      background: var(--teal);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-mark svg { width: 15px; height: 15px; }
    .logo-name { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
    .btn-nav {
      font-family: inherit; font-size: 13px; font-weight: 600;
      padding: 8px 16px; border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface); color: var(--text-2);
      cursor: pointer; text-decoration: none;
      transition: all var(--transition);
    }
    .btn-nav:hover { background: var(--bg); color: var(--text); }

    /* ── Page ── */
    .page-wrap {
      display: flex; align-items: center; justify-content: center;
      min-height: calc(100vh - 57px);
      padding: 40px 24px;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 40px 36px;
      max-width: 420px;
      width: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: var(--teal-faint);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; margin: 0 auto 20px;
    }
    .card-title {
      font-size: 20px; font-weight: 800; letter-spacing: -.4px;
      margin-bottom: 6px; text-align: center;
    }
    .card-sub {
      font-size: 14px; color: var(--text-2); line-height: 1.6;
      margin-bottom: 28px; text-align: center;
    }

    form { width: 100%; align-self: stretch; }
    .form-group {
      display: flex; flex-direction: column; gap: 10px;
      margin-bottom: 16px;
    }
    .form-input {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 11px 14px;
      border: 1.5px solid var(--border); border-radius: var(--radius);
      font-family: inherit; font-size: 14px; color: var(--text);
      background: var(--bg); outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .form-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-dim); }
    .form-input::placeholder { color: var(--text-3); }

    .btn-submit {
      display: block;
      width: 100%;
      padding: 13px 20px;
      background: var(--teal); color: white;
      font-family: inherit; font-size: 15px; font-weight: 700; text-align: center;
      border: none; border-radius: var(--radius);
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,112,184,.25);
      transition: all var(--transition);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-submit:hover { background: var(--teal-hover); box-shadow: 0 6px 28px rgba(0,112,184,.3); }

    .error-msg {
      align-self: stretch;
      margin-bottom: 16px; font-size: 13px;
      color: #B91C1C; background: #FEE2E2;
      padding: 8px 12px; border-radius: 8px;
      text-align: left;
    }
    .info-msg {
      align-self: stretch;
      margin-bottom: 16px; font-size: 13px;
      color: #92400E; background: #FEF3C7;
      padding: 8px 12px; border-radius: 8px;
      text-align: left;
    }

    .back-link {
      display: inline-block; margin-top: 20px;
      font-size: 13px; color: var(--text-3);
      text-decoration: none;
    }
    .back-link:hover { color: var(--text-2); }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="/">
      <svg width="40" height="40" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><rect width="200" height="200" rx="24" fill="#0070B8"/><text x="100" y="148" font-family="Georgia,serif" font-size="140" font-weight="700" fill="white" text-anchor="middle">P</text></svg>
      <span class="logo-name" style="color:#0070B8">Prizzy</span>
    </a>
    <a href="/" class="btn-nav">← Retour</a>
  </div>
</nav>

<div class="page-wrap">
  <div class="card">
    <div class="card-icon">👋</div>
    <p class="card-title">Bon retour sur Prizzy</p>
    <p class="card-sub">Connectez-vous pour accéder à votre espace.</p>

    {% if login_info %}
    <p class="info-msg">{{ login_info }}</p>
    {% endif %}
    {% if login_error %}
    <p class="error-msg">{{ login_error }}</p>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <input class="form-input" type="email" name="email"
               placeholder="votre@email.com" required
               autocomplete="email" inputmode="email">
        <input class="form-input" type="password" name="password"
               placeholder="Mot de passe" required
               autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit">Se connecter →</button>
    </form>

    <a class="back-link" href="/forgot-password">Mot de passe oublié ?</a>
    <a class="back-link" href="/">Pas encore abonné ? Découvrir Prizzy</a>
  </div>
</div>

</body>
</html>
